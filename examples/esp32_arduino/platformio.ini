; PlatformIO Project Configuration
; ESP32 Arduino example using the logging framework
;
; The library is taken from this repository (two folders up) as a regular
; PlatformIO dependency. All library sources are compiled; the ESP32 port
; (src/platforms/esp32.c) is selected automatically.

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino

; Serial monitor
monitor_speed = 115200

; Logging library from this repository
lib_deps =
    symlink://../..
