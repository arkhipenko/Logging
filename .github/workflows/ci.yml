name: CI

on:
  push:
    branches: [main, testing]
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    name: Host tests (gcc, g++, sanitizers)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run host tests
        run: bash tests/host/run.sh

  # Informational only: the current ubuntu-latest image (Ubuntu 26.04 from
  # 2026-10-19) ships a newer gcc on which one host check behaves differently
  # (the format of a compiled-out call is not checked). Does not block.
  host-tests-latest:
    name: Host tests on ubuntu-latest (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Compiler versions
        run: gcc --version && g++ --version
      - name: Run host tests
        run: bash tests/host/run.sh

  arduino-cli:
    name: Examples (ESP32, arduino-cli)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          libraries: |
            - source-path: ./
          sketch-paths: |
            - examples/arduinolog_serial

  platformio:
    name: Examples (ESP32, PlatformIO)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build examples/esp32_arduino
        run: pio run -d examples/esp32_arduino
